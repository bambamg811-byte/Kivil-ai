<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b12">
<meta name="description" content="Kıvıl AI ile sohbet et ve fikirlerini keşfet.">
<title>Kıvıl AI</title>

<style>
:root{
  color-scheme:dark;
  --bg:#090b12;
  --line:rgba(168,174,255,.12);
  --text:#f1f3ff;
  --muted:#8e95ad;
  --purple:#9a83ff;
  --blue:#63d9ff;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}

button,textarea{font:inherit}
button{color:inherit}

.app{
  height:100dvh;
  display:flex;
  background:
    radial-gradient(ellipse at 65% -18%,rgba(96,76,190,.12),transparent 44%),
    var(--bg);
}

.sidebar{
  width:254px;
  flex:0 0 254px;
  display:flex;
  flex-direction:column;
  background:rgba(12,14,23,.94);
  border-right:1px solid var(--line);
  padding:22px 14px 14px;
  z-index:5;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  padding:1px 8px 25px;
}

.brand-mark{
  height:34px;
  width:34px;
  border-radius:12px;
  display:grid;
  place-items:center;
  font-size:20px;
  font-weight:700;
  color:white;
  background:linear-gradient(140deg,#9476ff,#5bdcff);
  box-shadow:0 0 22px rgba(126,112,255,.22);
}

.brand-name{
  font-weight:700;
  font-size:17px;
  letter-spacing:-.55px;
}

.brand-name span{
  color:#a99aff;
  font-weight:500;
}

.new-chat{
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  text-align:left;
  border:1px solid rgba(164,151,255,.22);
  border-radius:12px;
  padding:11px 12px;
  background:linear-gradient(
    110deg,
    rgba(123,98,227,.12),
    rgba(73,164,218,.04)
  );
  cursor:pointer;
  transition:.2s;
}

.new-chat:hover{
  border-color:rgba(168,151,255,.5);
  background:rgba(133,113,255,.12);
}

.plus{
  font-size:20px;
  color:#b7aaff;
  line-height:1;
}

.side-label{
  font-size:10px;
  color:#707992;
  text-transform:uppercase;
  letter-spacing:1.5px;
  margin:27px 10px 10px;
}

.history{
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:4px;
  min-height:0;
}

.history-item{
  border:1px solid transparent;
  border-radius:9px;
  background:transparent;
  color:#aab0c4;
  padding:10px;
  text-align:left;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  cursor:pointer;
  font-size:12.5px;
}

.history-item:hover,
.history-item.active{
  background:rgba(138,128,255,.08);
  border-color:rgba(138,128,255,.1);
  color:#f0efff;
}

.sidebar-bottom{
  margin-top:auto;
  padding:13px 9px 3px;
  border-top:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:9px;
  color:#9ba2b8;
  font-size:12px;
}

.status-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#68ddb4;
  box-shadow:0 0 10px rgba(104,221,180,.45);
}

.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  position:relative;
}

.topbar{
  height:62px;
  flex:0 0 62px;
  padding:0 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid rgba(168,174,255,.07);
}

.topbar-title{
  font-size:12px;
  color:#9ba2b8;
  display:flex;
  align-items:center;
  gap:8px;
}

.topbar-title b{
  font-weight:550;
  color:#daddf0;
}

.topbar-right{
  font-size:11px;
  color:#737b95;
  display:flex;
  gap:7px;
  align-items:center;
}

.mode-indicator{
  height:25px;
  padding:0 9px;
  display:flex;
  align-items:center;
  gap:6px;
  border:1px solid var(--line);
  border-radius:20px;
  background:rgba(255,255,255,.015);
}

.main-scroll{
  flex:1;
  overflow:auto;
  scroll-behavior:smooth;
}

.conversation{
  width:min(calc(100% - 40px),800px);
  margin:0 auto;
  min-height:100%;
  display:flex;
  flex-direction:column;
  padding:48px 0 32px;
}

.welcome{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px 0 70px;
}

.hero-orb{
  height:62px;
  width:62px;
  border-radius:22px;
  display:grid;
  place-items:center;
  font-size:29px;
  background:linear-gradient(
    145deg,
    rgba(152,128,255,.17),
    rgba(89,213,255,.08)
  );
  border:1px solid rgba(163,151,255,.24);
  box-shadow:
    0 0 50px rgba(115,93,231,.1),
    inset 0 0 20px rgba(120,124,255,.04);
  position:relative;
  margin-bottom:24px;
}

.hero-orb:after{
  content:"";
  position:absolute;
  inset:-6px;
  border-radius:27px;
  border:1px solid rgba(107,209,255,.08);
}

.eyebrow{
  font-size:10px;
  letter-spacing:2.3px;
  text-transform:uppercase;
  color:#a39ae0;
  margin-bottom:14px;
}

h1{
  font-size:clamp(30px,4vw,43px);
  font-weight:630;
  letter-spacing:-1.7px;
  line-height:1.15;
  margin:0;
  max-width:650px;
  background:linear-gradient(
    105deg,
    #f3f2ff 18%,
    #c9c2ff 56%,
    #9de8ff 100%
  );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.welcome p{
  margin:16px 0 0;
  color:#8991aa;
  font-size:14px;
  line-height:1.7;
  max-width:440px;
}

.messages{
  display:flex;
  flex-direction:column;
  gap:24px;
  padding:0 0 26px;
}

.message{
  display:flex;
  gap:12px;
  align-items:flex-start;
  animation:appear .22s ease;
}

@keyframes appear{
  from{
    opacity:0;
    transform:translateY(5px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.avatar{
  width:29px;
  height:29px;
  flex:0 0 29px;
  border-radius:10px;
  display:grid;
  place-items:center;
  font-size:13px;
  background:#161a29;
  border:1px solid var(--line);
  color:#c9c4ff;
}

.message.user .avatar{
  background:linear-gradient(145deg,#8270e9,#3e9dc9);
  color:white;
  border:0;
}

.message-body{
  min-width:0;
  flex:1;
  padding-top:3px;
  font-size:14px;
  line-height:1.8;
  color:#dce0f1;
  overflow-wrap:anywhere;
}

.message.user .message-body{
  color:#f5f5ff;
}

.message-label{
  font-size:10px;
  color:#78819b;
  margin-bottom:4px;
  letter-spacing:.4px;
}

.message-body h2,
.message-body h3{
  margin:.9em 0 .3em;
}

.message-body pre{
  white-space:pre-wrap;
  overflow:auto;
  padding:13px 15px;
  border:1px solid var(--line);
  background:#0a0d16;
  border-radius:10px;
}

.message-body code{
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:.9em;
}

.message-body img.generated-image{
  display:block;
  max-width:min(100%,550px);
  max-height:520px;
  object-fit:contain;
  border-radius:12px;
  border:1px solid var(--line);
  margin-top:12px;
}

.typing{
  display:flex;
  align-items:center;
  gap:5px;
  height:25px;
}

.typing i{
  width:5px;
  height:5px;
  border-radius:100%;
  background:#a89aff;
  animation:pulse 1s infinite;
}

.typing i:nth-child(2){animation-delay:.13s}
.typing i:nth-child(3){animation-delay:.26s}

@keyframes pulse{
  0%,80%,100%{
    opacity:.25;
    transform:translateY(0);
  }
  40%{
    opacity:1;
    transform:translateY(-3px);
  }
}

.composer-wrap{
  width:min(calc(100% - 40px),800px);
  margin:0 auto;
  padding:12px 0 19px;
  background:linear-gradient(0deg,var(--bg) 77%,transparent);
}

.composer{
  padding:12px 12px 10px;
  border:1px solid rgba(163,151,255,.18);
  border-radius:17px;
  background:rgba(17,20,32,.92);
  box-shadow:
    0 12px 55px rgba(0,0,0,.2),
    0 0 24px rgba(95,81,195,.045);
  transition:border-color .2s,box-shadow .2s;
}

.composer:focus-within{
  border-color:rgba(154,131,255,.45);
  box-shadow:
    0 0 0 3px rgba(154,131,255,.045),
    0 12px 50px rgba(0,0,0,.22);
}

textarea{
  display:block;
  width:100%;
  resize:none;
  min-height:45px;
  max-height:180px;
  padding:8px 7px 10px;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-size:14px;
  line-height:1.6;
}

textarea::placeholder{color:#777f98}

.composer-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.mode-list{
  display:flex;
  align-items:center;
  gap:5px;
  flex-wrap:wrap;
}

.mode-btn{
  border:1px solid transparent;
  background:transparent;
  color:#8e96ae;
  display:flex;
  align-items:center;
  gap:6px;
  padding:7px 10px;
  border-radius:9px;
  font-size:11px;
  cursor:pointer;
  transition:.18s;
}

.mode-btn:hover{
  background:rgba(255,255,255,.035);
  color:#dce0f1;
}

.mode-btn.active{
  color:#cfc7ff;
  border-color:rgba(160,143,255,.18);
  background:rgba(141,119,255,.1);
}

.mode-icon{font-size:13px}

.send-btn{
  height:35px;
  width:38px;
  border:0;
  border-radius:11px;
  background:linear-gradient(140deg,#9a82ff,#64d5f4);
  color:#0c0e18;
  font-weight:800;
  font-size:17px;
  cursor:pointer;
  box-shadow:0 3px 17px rgba(119,124,255,.16);
  transition:transform .18s,filter .18s;
}

.send-btn:hover{
  filter:brightness(1.08);
  transform:translateY(-1px);
}

.send-btn:disabled{
  opacity:.45;
  cursor:default;
  transform:none;
}

.disclaimer{
  text-align:center;
  font-size:10px;
  color:#626b83;
  margin-top:11px;
}

.mobile-menu{
  display:none;
  background:transparent;
  border:1px solid var(--line);
  border-radius:8px;
  width:34px;
  height:34px;
  cursor:pointer;
}

.empty-history{
  font-size:12px;
  line-height:1.6;
  color:#59627a;
  padding:8px 10px;
}

@media(min-width:1000px){
  .conversation{padding-top:40px}
}

@media(max-width:700px){
  .sidebar{
    position:fixed;
    inset:0 auto 0 0;
    width:260px;
    transform:translateX(-101%);
    transition:transform .22s ease;
    box-shadow:15px 0 50px rgba(0,0,0,.35);
  }

  .sidebar.open{transform:translateX(0)}
  .mobile-menu{display:grid;place-items:center}

  .topbar{
    padding:0 14px;
    height:56px;
    flex-basis:56px;
    gap:10px;
  }

  .topbar-title{margin-right:auto}
  .topbar-right{display:none}

  .conversation,
  .composer-wrap{
    width:calc(100% - 28px);
  }

  .conversation{padding-top:20px}
  .welcome{padding:15px 0 65px}

  .hero-orb{
    height:55px;
    width:55px;
    margin-bottom:19px;
  }

  h1{
    font-size:32px;
    letter-spacing:-1.2px;
  }

  .welcome p{
    font-size:13px;
    max-width:320px;
  }

  .composer-wrap{padding-bottom:12px}
  .composer{border-radius:15px;padding:9px}
  .mode-btn{padding:7px 8px}
  .disclaimer{font-size:9px}
}
</style>
</head>

<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">✦</div>
      <div class="brand-name">Kıvıl<span> AI</span></div>
    </div>

    <button class="new-chat" id="newChatBtn">
      <span class="plus">＋</span>
      <span>Yeni sohbet</span>
    </button>

    <div class="side-label">Son sohbetler</div>

    <div class="history" id="history">
      <div class="empty-history">Sohbetlerin burada görünecek.</div>
    </div>

    <div class="sidebar-bottom">
      <span class="status-dot"></span>
      <span>Kıvıl AI hazır</span>
    </div>
  </aside>

  <main class="main">

    <header class="topbar">
      <button class="mobile-menu" id="mobileMenu" aria-label="Menüyü aç">☰</button>

      <div class="topbar-title">
        <b>Kıvıl AI</b>
        <span>/</span>
        <span id="topMode">Sohbet</span>
      </div>

      <div class="topbar-right">
        <span class="mode-indicator">
          <span class="status-dot"></span>
          Hazır
        </span>
      </div>
    </header>

    <div class="main-scroll" id="mainScroll">
      <section class="conversation">

        <div class="welcome" id="welcome">
          <div class="hero-orb">✦</div>
          <div class="eyebrow">Düşün. Keşfet. Üret.</div>
          <h1>Ne üzerinde çalışalım?</h1>
          <p>Sorunu yaz, bir fikri geliştir ya da hayalindeki görseli tarif et. Başlayalım.</p>
        </div>

        <div class="messages" id="messages" hidden></div>

      </section>
    </div>

    <div class="composer-wrap">
      <form class="composer" id="composer">

        <textarea
          id="prompt"
          rows="1"
          placeholder="Kıvıl'a bir şey sor..."
          aria-label="Mesajını yaz"
        ></textarea>

        <div class="composer-bottom">

          <div class="mode-list" role="group" aria-label="Mod seç">
            <button type="button" class="mode-btn active" data-mode="chat">
              <span class="mode-icon">✧</span>Sohbet
            </button>

            <button type="button" class="mode-btn" data-mode="research">
              <span class="mode-icon">⌕</span>Araştırma
            </button>

            <button type="button" class="mode-btn" data-mode="image">
              <span class="mode-icon">▧</span>Görsel
            </button>
          </div>

          <button
            type="submit"
            class="send-btn"
            id="sendBtn"
            aria-label="Gönder"
          >↑</button>

        </div>
      </form>

      <div class="disclaimer">
        Kıvıl AI hata yapabilir. Önemli bilgileri kontrol etmeyi unutma.
      </div>
    </div>

  </main>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);

  const promptEl = $("prompt");
  const messagesEl = $("messages");
  const welcomeEl = $("welcome");
  const historyEl = $("history");
  const mainScroll = $("mainScroll");
  const sendBtn = $("sendBtn");

  const STORAGE_KEY = "kivil-ai-chats-v2";

  let mode = "chat";
  let activeId = null;
  let busy = false;

  let chats = loadChats();

  function loadChats() {
    try {
      const value = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      return Array.isArray(value) ? value : [];
    } catch {
      return [];
    }
  }

  function saveChats() {
    try {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(chats.slice(0, 35))
      );
    } catch {}
  }

  function makeId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function currentChat() {
    let chat = chats.find(item => item.id === activeId);

    if (!chat) {
      chat = {
        id: makeId(),
        title: "Yeni sohbet",
        messages: [],
        updatedAt: Date.now()
      };

      chats.unshift(chat);
      activeId = chat.id;
    }

    return chat;
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function formatText(value) {
    let text = escapeHtml(value);

    text = text.replace(
      /```([\w-]*)\n?([\s\S]*?)```/g,
      (_, language, code) =>
        "<pre><code>" + code.trim() + "</code></pre>"
    );

    text = text.replace(/`([^`]+)`/g, "<code>$1</code>");
    text = text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");

    text = text.replace(/^### (.+)$/gm, "<h3>$1</h3>");
    text = text.replace(/^## (.+)$/gm, "<h2>$1</h2>");
    text = text.replace(/^# (.+)$/gm, "<h2>$1</h2>");

    text = text.replace(/^\s*[-*] (.+)$/gm, "• $1");

    return text.replace(/\n/g, "<br>");
  }

  function renderMessages() {
    const chat = chats.find(item => item.id === activeId);
    const messages = chat?.messages || [];

    welcomeEl.hidden = messages.length > 0;
    messagesEl.hidden = messages.length === 0;
    messagesEl.innerHTML = "";

    messages.forEach(message => {
      const article = document.createElement("article");

      article.className =
        "message " + (message.role === "user" ? "user" : "assistant");

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = message.role === "user" ? "●" : "✦";

      const body = document.createElement("div");
      body.className = "message-body";

      const label = document.createElement("div");
      label.className = "message-label";
      label.textContent = message.role === "user" ? "Sen" : "Kıvıl AI";

      body.appendChild(label);

      const content = document.createElement("div");

      if (message.image) {
        content.innerHTML = formatText(
          message.content || "Oluşturulan görsel"
        );

        const img = document.createElement("img");
        img.className = "generated-image";
        img.src = message.image;
        img.alt = message.content || "Kıvıl AI tarafından oluşturulan görsel";
        img.loading = "lazy";

        content.appendChild(img);
      } else if (message.loading) {
        content.innerHTML =
          '<div class="typing" aria-label="Yanıt hazırlanıyor">' +
          "<i></i><i></i><i></i></div>";
      } else {
        content.innerHTML = formatText(message.content || "");
      }

      body.appendChild(content);
      article.append(avatar, body);
      messagesEl.appendChild(article);
    });

    requestAnimationFrame(() => {
      mainScroll.scrollTop = mainScroll.scrollHeight;
    });
  }

  function renderHistory() {
    historyEl.innerHTML = "";

    const list = [...chats]
      .filter(chat => chat.messages?.length)
      .sort((a, b) => b.updatedAt - a.updatedAt);

    if (!list.length) {
      historyEl.innerHTML =
        '<div class="empty-history">Sohbetlerin burada görünecek.</div>';
      return;
    }

    list.slice(0, 25).forEach(chat => {
      const button = document.createElement("button");

      button.className =
        "history-item" + (chat.id === activeId ? " active" : "");

      button.textContent = chat.title || "Yeni sohbet";
      button.title = button.textContent;

      button.addEventListener("click", () => {
        activeId = chat.id;
        renderHistory();
        renderMessages();
        closeMobileMenu();
      });

      historyEl.appendChild(button);
    });
  }

  function closeMobileMenu() {
    $("sidebar").classList.remove("open");
  }

  function setMode(nextMode) {
    mode = nextMode;

    document.querySelectorAll(".mode-btn").forEach(button => {
      button.classList.toggle("active", button.dataset.mode === mode);
    });

    $("topMode").textContent =
      mode === "image"
        ? "Görsel oluşturma"
        : mode === "research"
          ? "Araştırma"
          : "Sohbet";

    promptEl.placeholder =
      mode === "image"
        ? "Nasıl bir görsel oluşturalım?"
        : mode === "research"
          ? "Araştırmak istediğin konuyu yaz..."
          : "Kıvıl'a bir şey sor...";

    promptEl.focus();
  }

  document.querySelectorAll(".mode-btn").forEach(button => {
    button.addEventListener("click", () => setMode(button.dataset.mode));
  });

  $("newChatBtn").addEventListener("click", () => {
    activeId = null;
    renderMessages();
    renderHistory();
    promptEl.focus();
    closeMobileMenu();
  });

  $("mobileMenu").addEventListener("click", () => {
    $("sidebar").classList.toggle("open");
  });

  promptEl.addEventListener("input", () => {
    promptEl.style.height = "auto";
    promptEl.style.height =
      Math.min(promptEl.scrollHeight, 180) + "px";
  });

  promptEl.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      $("composer").requestSubmit();
    }
  });

  $("composer").addEventListener("submit", async event => {
    event.preventDefault();

    const text = promptEl.value.trim();

    if (!text || busy) return;

    busy = true;
    sendBtn.disabled = true;

    promptEl.value = "";
    promptEl.style.height = "auto";

    const chat = currentChat();

    chat.messages.push({
      role: "user",
      content: text
    });

    if (chat.messages.filter(message => message.role === "user").length === 1) {
      chat.title = text.length > 37 ? text.slice(0, 37) + "…" : text;
    }

    chat.updatedAt = Date.now();

    const pendingId = makeId();

    chat.messages.push({
      role: "assistant",
      content: "",
      loading: true,
      _id: pendingId
    });

    saveChats();
    renderHistory();
    renderMessages();

    try {
      if (mode === "image") {
        const response = await fetch("/api/image", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: text })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.error || "Görsel oluşturulamadı.");
        }

        replacePending(chat, pendingId, {
          role: "assistant",
          content: "İsteğine göre oluşturulan görsel:",
          image: data.image
        });
      } else {
        const conversation = chat.messages
          .filter(message => !message.loading && !message.image)
          .map(message => ({
            role: message.role,
            content: message.content
          }));

        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            mode: mode === "research" ? "research" : "chat",
            messages: conversation
          })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.error || "Yanıt alınamadı.");
        }

        replacePending(chat, pendingId, {
          role: "assistant",
          content: data.reply || "Yanıt boş geldi."
        });
      }
    } catch (error) {
      replacePending(chat, pendingId, {
        role: "assistant",
        content: "Bir sorun oluştu: " +
          (error.message || "İstek tamamlanamadı.")
      });
    } finally {
      busy = false;
      sendBtn.disabled = false;

      renderHistory();
      renderMessages();
      promptEl.focus();
    }
  });

  function replacePending(chat, id, replacement) {
    const index = chat.messages.findIndex(message => message._id === id);

    if (index >= 0) {
      chat.messages[index] = replacement;
    }

    chat.updatedAt = Date.now();
    saveChats();
  }

  renderHistory();
  renderMessages();
})();
</script>
</body>
</html>
